<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Model 3D Financial Suite & Forecasting Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
            perspective: 1200px;
        }

        #webgl3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .card-3d {
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.7) 0%, rgba(17, 24, 39, 0.85) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transform-style: preserve-3d;
        }

        .tab-3d {
            padding: 12px 22px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.85rem;
            color: #9ca3af;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-3d.active {
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 space-y-4">
    <canvas id="webgl3d"></canvas>
    <header class="card-3d p-6 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white text-3xl">
                <i class="fa-solid fa-cube"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black text-sky-400">10-Model 3D Financial Suite & Dashboard</h1>
                <p class="text-xs text-slate-400">Node.js WebGL Engine | Figures in $ Millions ($M)</p>
            </div>
        </div>
    </header>
    <div class="flex-1 glass-card p-6">
        <p class="text-slate-300">3D WebGL Dashboard compiled successfully.</p>
    </div>
</body>
</html>
